<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input:invalid:not(:placeholder-shown) {
            border-color: #ff6b6b;
        }

        input:valid:not(:placeholder-shown) {
            border-color: #51cf66;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .form-footer a {
            color: #667eea;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .success-message {
            display: none;
            color: #51cf66;
            margin-top: 15px;
            padding: 10px;
            background: #e6ffed;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email"
                    required
                >
                <div class="error-message" id="emailError">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password (min 6 characters)"
                    minlength="6"
                    required
                >
                <div class="error-message" id="passwordError">Password must be at least 6 characters long</div>
            </div>

            <button type="submit">Login</button>
            <div class="success-message" id="successMessage">Login successful!</div>
        </form>

        <div class="form-footer">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const successMessage = document.getElementById('successMessage');

        // Real-time validation for email
        emailInput.addEventListener('blur', function() {
            if (this.value && !this.validity.valid) {
                emailError.style.display = 'block';
            } else {
                emailError.style.display = 'none';
            }
        });

        emailInput.addEventListener('input', function() {
            if (this.validity.valid) {
                emailError.style.display = 'none';
            }
        });

        // Real-time validation for password
        passwordInput.addEventListener('blur', function() {
            if (this.value && this.value.length < 6) {
                passwordError.style.display = 'block';
            } else {
                passwordError.style.display = 'none';
            }
        });

        passwordInput.addEventListener('input', function() {
            if (this.value.length >= 6) {
                passwordError.style.display = 'none';
            }
        });

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Validate email
            if (!emailInput.validity.valid) {
                emailError.style.display = 'block';
                emailInput.focus();
                return;
            }

            // Validate password length
            if (passwordInput.value.length < 6) {
                passwordError.style.display = 'block';
                passwordInput.focus();
                return;
            }

            // Clear error messages
            emailError.style.display = 'none';
            passwordError.style.display = 'none';

            // Show success message
            successMessage.style.display = 'block';
            
            // Log the form data (in a real app, you'd send this to a server)
            console.log({
                email: emailInput.value,
                password: passwordInput.value
            });

            // Reset form after 2 seconds
            setTimeout(() => {
                form.reset();
                successMessage.style.display = 'none';
            }, 2000);
        });
    </script>
</body>
</html>
