<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function check(){
        var uid = document.getElementById("userid").value;
        var pwd = document.getElementById("passwd").value;
        var cpwd = document.getElementById("cpasswd").value;
        
        if(uid.length <= 0){
            alert("username cannot be empty");
            return false;
        }
        if(pwd.length <= 0){
            alert("password can not be empty");
            return false;
        }
        if(cpwd.length <= 0){
            alert("confirm password can not be empty");
            return false;
        }
        if(pwd !== cpwd){
            alert("passwords do not match");
            return false;
        }
        
        if(uid === "admin" && pwd === "admin123"){
            alert("Login successful");
            return true;
        } else {
            alert("Invalid username or password");
            return false;
        }
    }
</script>

<body>
    <form action="" method="post">
        <label for="username">Username</label>
        <input type="text" id="userid" name="username"><br><br>
        <label for="password">Password</label>
        <input type="password" id="passwd" name="password"><br><br>
        <label for="cpassword">Confirm Password</label>
        <input type="password" id="cpasswd" name="cpassword"><br><br>
        <button type="button" onclick="check()">Submit</button>
    </form>
</body>
</html>
