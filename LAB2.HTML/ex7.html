<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id = "demo"></p>
    <script>
        var names = new Set(["ram","raj","sara"]);
        names.add("ramesh");
        let txt = "";
        const fruits = new Map([
            ["apple",500],
            ["banana",200],
            ["orange",300]
        ])
        for (const [key, value] of fruits.entries()){
            txt += key+":"+value+"<br>";
        }
        document.getElementById("demo").innerHTML = txt;
    </script>
    
</body>
</html>
