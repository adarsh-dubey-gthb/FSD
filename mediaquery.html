<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Query Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
      text-align: center;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    /* Default styles for laptop screens (min-width: 768px) */
    @media (min-width: 768px) {
      body {
        background-color: #e0f7fa;
      }

      .container {
        padding: 40px;
      }

      h1 {
        font-size: 2.5em;
      }

      p {
        font-size: 1.2em;
      }
    }

    /* Styles for phone screens (max-width: 767px) */
    @media (max-width: 767px) {
      body {
        background-color: #fff3e0;
      }

      .container {
        padding: 15px;
      }

      h1 {
        font-size: 1.8em;
      }

      p {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Responsive Page</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Error, dolore sapiente! Doloremque rerum fugit ad. Vero, eos ipsa. Sunt, fugiat repellendus? Voluptas ratione quis libero..</p>
  </div>
</body>
</html>
